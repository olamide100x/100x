name: Daily ETL Pipeline

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  run-etl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          cd scripts
          pip install -r requirements.txt
          python main.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
